name: Train waste recycling model

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: recycle-model-training
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision scikit-learn pillow numpy
      - name: Train
        run: python train.py --epochs 5 --batch-size 64
      - name: Package
        run: |
          printf '%s\n' 'Waste recycling classifier trained from TrashNet + RealWaste. See metrics.json for held-out test results.' > output/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: waste-recycling-model
          path: recycle-model-training/output/
          retention-days: 30
